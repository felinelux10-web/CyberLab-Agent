  idle_sleep_sec: 5
  log_max_size_mb: 50
  queue_max_age_sec: 300

current_phase: 1
next_phase: 2

phases:
  - id: 0
    name: Infrastructure
    status: done
  - id: 1
    name: Memory
    status: done
  - id: 2
    name: Awareness
    status: in_progress
