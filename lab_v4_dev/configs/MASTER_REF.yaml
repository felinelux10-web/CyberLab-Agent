project:
  name: CyberLab Agent
  version: 5.9.13-dev
  reference_version: "5.9.10.O"
  architecture_status: LOCKED
  philosophy: Small Stable Evolutions

hard_limits:
  max_ram_mb: 150
  max_cpu_percent: 40
  max_tasks_per_hour: 10
