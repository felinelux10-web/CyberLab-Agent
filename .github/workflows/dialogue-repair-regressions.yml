name: Dialogue Repair Regressions

on:
  push:
    branches:
      - work/FRIENDLY-DIALOGUE-REPAIR-01
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dialogue-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out experimental branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest requests PyYAML psutil

      - name: Run dialogue, memory, knowledge, and local-response regressions
        run: |
          python -m pytest -q \
            tests/test_saved_session_selection_regressions.py \
            tests/test_saved_session_summary_routing.py \
            tests/test_dialogue_continuity_regressions.py \
            tests/test_continuity_prompt_integration.py \
            tests/test_decision_ownership_contract.py \
            tests/test_dialogue_ownership_e1_e6.py \
            tests/test_knowledge_scope.py \
            tests/test_report_file_search_and_component_knowledge.py \
            tests/test_local_project_response_routing.py \
            tests/test_arabic_dialogue_routing_regressions.py \
            tests/test_local_response_engine.py \
            tests/test_unified_local_response.py \
            tests/test_phase_a_conversation_safety.py \
            tests/test_agent_self_description.py \
            tests/test_g07_conversation_semantics.py \
            tests/test_p02_conversation_intent.py \
            tests/test_gateway_fallback_contract.py

  full-suite-advisory:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - name: Check out experimental branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest requests PyYAML psutil

      - name: Run full test suite (advisory; unrelated failures remain visible)
        run: |
          python -m pytest -q
