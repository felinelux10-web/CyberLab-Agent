name: Dialogue Repair Regressions

on:
  push:
    branches:
      - work/FRIENDLY-DIALOGUE-REPAIR-01
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dialogue-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out experimental branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest requests PyYAML

      - name: Run the full test suite
        run: |
          python -m pytest -q
